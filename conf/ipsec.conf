version 2.0

# Ported from the openswan-era syntax (EPEL on Amazon Linux 2 — which in
# fact shipped libreswan 3.x under the openswan name) to modern libreswan:
# the nat_traversal/interfaces keywords are gone (NAT traversal is always
# on), protostack=netkey is now xfrm, and left= uses %defaultroute instead
# of a sed-injected private IP.

config setup
	protostack=xfrm
	# Allow multiple road-warrior clients behind the same NAT / using the
	# same PSK identity without bumping each other off.
	uniqueids=no
	# The native L2TP/IPsec clients (macOS/iOS/Windows/Android) are IKEv1.
	ikev1-policy=accept
	# Exclude the L2TP client pool so a roaming client can't claim it as
	# its own virtual network.
	virtual-private=%v4:10.0.0.0/8,%v4:192.168.0.0/16,%v4:172.16.0.0/12,%v4:25.0.0.0/8,%v6:fd00::/8,%v6:fe80::/10,%v4:!<L2TP_DHCP_CIDR>

conn vpnpsk
	auto=add
	# libreswan 4.x spelling of "IKEv1 only" (keyexchange=ikev1 arrived in 5.x)
	ikev2=never
	# The NAT interface's address (the EC2 private IP), rendered by the
	# entrypoint — %defaultroute would fail on hosts without a default
	# route in the main table.
	left=<LEFT_IP>
	leftprotoport=17/1701
	right=%any
	rightprotoport=17/%any
	authby=secret
	# Strong-only crypto: AES-256 + SHA2-256 + MODP2048 (DH14) for IKE and
	# AES-256 + SHA2-256 for ESP; drops the legacy Openswan defaults
	# (3DES, MD5, SHA1, MODP1024/DH2).
	ike=aes256-sha2_256-modp2048
	phase2alg=aes256-sha2_256
	pfs=yes
	type=transport
	# Road-warrior DPD: libreswan requires dpdtimeout > dpddelay, and
	# dpdaction=restart is meaningless against right=%any (the server
	# cannot re-initiate to an unknown peer) — clear the dead SA instead.
	dpddelay=30
	dpdtimeout=120
	dpdaction=clear
